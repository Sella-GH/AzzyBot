# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/workflows"
      - "/.github/actions"
    schedule:
      interval: "daily"
    assignees:
      - "Sella-GH"
    commit-message:
      prefix: "[Actions]"
      include: "scope"
    labels:
      - "area-ci"
      - "area-dependencies"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Sella-GH"
    commit-message:
      prefix: "[.NET SDK]"
      include: "scope"
    labels:
      - "area-dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major" # We only want minor and patch releases of the newest SDK(s)

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Sella-GH"
    commit-message:
      prefix: "[NuGet]"
      include: "scope"
    labels:
      - "area-dependencies"
    groups:
      Analyzers:
        applies-to: version-updates
        patterns:
        - "Roslynator.Analyzers"
        - "Roslynator.CodeAnalysis.Analyzers"
        - "Roslynator.CodeFixes"
        - "Roslynator.Formatting.Analyzers"
        - "Roslynator.Refactorings"
        - "SonarAnalyzer.CSharp"
        update-types:
        - "major"
        - "minor"
        - "patch"
      Core:
        applies-to: version-updates
        patterns:
        - "DSharpPlus"
        - "DSharpPlus.Commands"
        - "DSharpPlus.Interactivity"
        - "LavaLink4NET.DSharpPlus.Nightly"
        - "Microsoft.EntityFrameworkCore.Tools"
        - "Microsoft.Extensions.Hosting"
        - "Microsoft.Extensions.Http"
        - "NReco.Logging.File"
        update-types:
        - "minor"
        - "patch"
      Database:
        applies-to: version-updates
        patterns:
        - "EntityFrameworkCore.Exceptions.PostgreSQL"
        - "Npgsql"
        - "Npgsql.Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types:
        - "minor"
        - "patch"
      Others:
        applies-to: version-updates
        exclude-patterns:
        - "DSharpPlus"
        - "DSharpPlus.Commands"
        - "DSharpPlus.Interactivity"
        - "EntityFrameworkCore.Exceptions.PostgreSQL"
        - "Microsoft.EntityFrameworkCore.Tools"
        - "Microsoft.Extensions.Hosting"
        - "Microsoft.Extensions.Http"
        - "LavaLink4NET.DSharpPlus.Nightly"
        - "Npgsql"
        - "Npgsql.Npgsql.EntityFrameworkCore.PostgreSQL"
        - "NReco.Logging.File"
        - "Roslynator.Analyzers"
        - "Roslynator.CodeAnalysis.Analyzers"
        - "Roslynator.CodeFixes"
        - "Roslynator.Formatting.Analyzers"
        - "Roslynator.Refactorings"
        - "SonarAnalyzer.CSharp"
        update-types:
        - "major"
        - "minor"
        - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Sella-GH"
    commit-message:
      prefix: "[Docker]"
      include: "scope"
    labels:
      - "area-docker"
      - "area-dependencies"
